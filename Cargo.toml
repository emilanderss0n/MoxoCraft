[workspace]
resolver = "3"
members = [
    "crates/moxocraft-sdk",
    "crates/moxocraft-lut-core",
    "crates/moxocraft-particles",
    "filters/chromatic-aberration",
    "filters/floating-particles",
    "filters/lut",
    "filters/lut-cinematic",
    "filters/lut-creative",
    "filters/snow",
    "tools/bench",
    "tools/lut-preview",
]

# The one version number for every plug-in: their manifests take it from here at build time.
[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
moxocraft-sdk = { path = "crates/moxocraft-sdk" }
moxocraft-lut-core = { path = "crates/moxocraft-lut-core" }
moxocraft-particles = { path = "crates/moxocraft-particles" }

# Plug-ins run inside PhotoCraft's WebAssembly interpreter, where every instruction counts, so we
# optimize for speed rather than file size (the host allows modules up to 32 MiB).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
